name: CI/CD Pipeline - Ceres

on:
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    name: 🧪 CI - Validação & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar Client do Prisma
        run: npx prisma generate

      - name: Checagem de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Teste de Build do Next.js
        run: npm run build

  deploy:
    name: 🚀 CD - Deploy Automático na VPS
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Preparar chave SSH da VPS
        id: ssh-key
        run: |
          {
            echo 'SSH_KEY<<EOF'
            echo '${{ secrets.VPS_SSH_KEY }}' | base64 -d
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Executar Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ steps.ssh-key.outputs.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd ~/ceres
            git checkout main
            git pull origin main
            docker compose up -d --build
            docker compose exec app npx prisma db push --accept-data-loss
            docker image prune -f