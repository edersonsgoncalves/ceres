services:
  db:
    image: postgres:16-alpine
    container_name: ceres-db
    restart: always
    environment:
      POSTGRES_DB: ceres
      POSTGRES_USER: ceres_user
      POSTGRES_PASSWORD: N1kMQd@aPukLR*q
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceres_user -d ceres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ceres-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: